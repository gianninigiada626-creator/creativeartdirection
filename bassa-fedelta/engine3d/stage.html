<script type="module">
import { SCENES } from './scenes.js';
// the film's type: Anton on posters and shirts, Permanent Marker for what is written by hand
for (const [fam, file] of [['Anton', 'Anton.ttf'], ['Permanent Marker', 'PermanentMarker.ttf']]) {
  const f = new FontFace(fam, `url(/bassa-fedelta/build/fonts/${file})`);

window.renderPanel = async (id, opts = {}) => {

  const people = [];

};

};

};

</script>
